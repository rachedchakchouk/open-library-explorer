# Mises à jour automatiques des dépendances (Dependabot).
# Une seule PR groupée par semaine pour les mises à jour mineures/correctives,
# une PR groupée séparée pour les correctifs de sécurité.
# Les montées majeures de Next.js / React se font à la main (les alertes de sécurité restent actives).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Tunis"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dépendances"]
    groups:
      securite:
        applies-to: security-updates
        patterns: ["*"]
      next:
        applies-to: version-updates
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
      mineures-et-correctifs:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
